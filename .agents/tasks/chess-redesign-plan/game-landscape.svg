<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Landscape redesign mock for the chess game</title>
  <desc id="desc">A full viewport chess game with a large board on the left and a quiet game ledger with status, moves, and controls on the right.</desc>
  <defs>
    <pattern id="board" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#d8cba8"/>
      <rect x="100" width="100" height="100" fill="#6e7552"/>
      <rect y="100" width="100" height="100" fill="#6e7552"/>
    </pattern>
    <style>
      .ui{font-family:'Segoe UI',sans-serif}.display{font-family:Georgia,serif}.muted{fill:#b9b3a4}.ink{fill:#f4f0e6}.tiny{font-size:12px;letter-spacing:.1em}.label{font-size:13px;font-weight:700;letter-spacing:.12em}.body{font-size:16px}.piece{font:74px Georgia,serif;text-anchor:middle;dominant-baseline:middle}.pw{fill:#f8f3e7;stroke:#292b25;stroke-width:1.4;paint-order:stroke}.pb{fill:#24231d;stroke:#efe6d1;stroke-width:.8;paint-order:stroke}.coord{font:700 11px 'Segoe UI',sans-serif;fill:#34372b}.rule{stroke:#3a3930;stroke-width:1}.button{fill:#2b2a23;stroke:#4b493e}.focus{fill:#d8ad55}.icon{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1440" height="900" fill="#171713"/>
  <rect x="0" y="0" width="12" height="900" fill="#d8ad55"/>

  <g class="ui">
    <text class="display ink" x="32" y="44" font-size="26" font-weight="700">Chess</text>
    <text class="muted label" x="118" y="41">TWO PLAYERS</text>
    <g transform="translate(1218 14)">
      <rect width="190" height="42" rx="4" class="button"/>
      <path d="M17 16v-5h5M31 16v-5h-5M17 26v5h5M31 26v5h-5" stroke="#f4f0e6" fill="none" stroke-width="1.8"/>
      <text class="ink body" x="45" y="27">Enter full screen</text>
    </g>
  </g>
  <line class="rule" x1="32" y1="66" x2="1408" y2="66"/>

  <g transform="translate(32 78)">
    <rect width="800" height="800" fill="url(#board)"/>
    <rect x="400" y="600" width="100" height="100" fill="#e5c15e" opacity=".62"/>
    <circle cx="450" cy="550" r="12" fill="#283128" opacity=".58"/>
    <circle cx="450" cy="450" r="12" fill="#283128" opacity=".58"/>
    <rect x="2" y="2" width="796" height="796" fill="none" stroke="#0f100d" stroke-width="4"/>

    <g class="coord">
      <text x="7" y="16">8</text><text x="7" y="116">7</text><text x="7" y="216">6</text><text x="7" y="316">5</text><text x="7" y="416">4</text><text x="7" y="516">3</text><text x="7" y="616">2</text><text x="7" y="716">1</text>
      <text x="89" y="792">a</text><text x="189" y="792">b</text><text x="289" y="792">c</text><text x="389" y="792">d</text><text x="489" y="792">e</text><text x="589" y="792">f</text><text x="689" y="792">g</text><text x="789" y="792">h</text>
    </g>

    <g class="piece pb">
      <text x="50" y="53">♜</text><text x="150" y="53">♞</text><text x="250" y="53">♝</text><text x="350" y="53">♛</text><text x="450" y="53">♚</text><text x="550" y="53">♝</text><text x="650" y="53">♞</text><text x="750" y="53">♜</text>
      <text x="50" y="153">♟</text><text x="150" y="153">♟</text><text x="250" y="153">♟</text><text x="350" y="153">♟</text><text x="450" y="153">♟</text><text x="550" y="153">♟</text><text x="650" y="153">♟</text><text x="750" y="153">♟</text>
    </g>
    <g class="piece pw">
      <text x="50" y="653">♟</text><text x="150" y="653">♟</text><text x="250" y="653">♟</text><text x="350" y="653">♟</text><text x="450" y="653">♟</text><text x="550" y="653">♟</text><text x="650" y="653">♟</text><text x="750" y="653">♟</text>
      <text x="50" y="753">♜</text><text x="150" y="753">♞</text><text x="250" y="753">♝</text><text x="350" y="753">♛</text><text x="450" y="753">♚</text><text x="550" y="753">♝</text><text x="650" y="753">♞</text><text x="750" y="753">♜</text>
    </g>
  </g>

  <g transform="translate(872 92)" class="ui">
    <text class="muted label" x="0" y="0">GAME STATUS</text>
    <circle cx="11" cy="39" r="10" fill="#f8f3e7" stroke="#36372f" stroke-width="2"/>
    <text class="display ink" x="36" y="48" font-size="30" font-weight="650">White to move</text>
    <text class="muted body" x="0" y="84">Select a piece, then choose a highlighted square.</text>

    <line class="rule" x1="0" y1="112" x2="536" y2="112"/>
    <text class="muted label" x="0" y="150">MOVE LEDGER</text>
    <text class="muted body" x="0" y="190">The first move has not been played.</text>
    <g transform="translate(0 222)">
      <text class="muted tiny" x="0" y="0">MOVE</text><text class="muted tiny" x="80" y="0">WHITE</text><text class="muted tiny" x="278" y="0">BLACK</text>
      <line class="rule" x1="0" y1="16" x2="536" y2="16"/>
      <text class="muted body" x="0" y="52">1.</text><text class="ink display" x="80" y="52" font-size="20">—</text><text class="ink display" x="278" y="52" font-size="20">—</text>
    </g>

    <line class="rule" x1="0" y1="338" x2="536" y2="338"/>
    <text class="muted label" x="0" y="376">GAME ACTIONS</text>
    <g transform="translate(0 396)">
      <rect width="116" height="48" rx="4" fill="#2b2a23" stroke="#4b493e"/><text class="ink body" x="58" y="30" text-anchor="middle">Undo move</text>
      <rect x="128" width="116" height="48" rx="4" fill="#2b2a23" stroke="#4b493e"/><text class="ink body" x="186" y="30" text-anchor="middle">Restart</text>
      <rect x="256" width="132" height="48" rx="4" fill="none" stroke="#4b493e"/><text class="muted body" x="322" y="30" text-anchor="middle">Main menu</text>
    </g>

    <g transform="translate(0 500)">
      <rect width="536" height="84" rx="4" fill="#24231d" stroke="#3a3930"/>
      <text class="muted tiny" x="18" y="25">CURRENT POSITION · FEN</text>
      <text x="18" y="54" fill="#d7d1c4" font-family="Consolas,monospace" font-size="13">rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/...</text>
    </g>

    <line class="rule" x1="0" y1="624" x2="536" y2="624"/>
    <text class="muted tiny" x="0" y="659">BOARD INPUT</text>
    <text class="ink body" x="0" y="689">Arrow keys move focus · Enter selects · Esc clears</text>
    <text class="muted" x="0" y="718" font-size="14">The board stays square and consumes the available height.</text>
  </g>
</svg>
