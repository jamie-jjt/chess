<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Portrait mobile redesign mock for the chess game</title>
  <desc id="desc">A full-height mobile chess game with compact header, player status, an edge-to-edge square board, reachable controls, and a collapsible move ledger.</desc>
  <defs>
    <pattern id="board" width="91.5" height="91.5" patternUnits="userSpaceOnUse">
      <rect width="91.5" height="91.5" fill="#d8cba8"/>
      <rect x="45.75" width="45.75" height="45.75" fill="#6e7552"/>
      <rect y="45.75" width="45.75" height="45.75" fill="#6e7552"/>
    </pattern>
    <style>
      .ui{font-family:'Segoe UI',sans-serif}.display{font-family:Georgia,serif}.ink{fill:#f4f0e6}.muted{fill:#b9b3a4}.label{font-size:10px;font-weight:700;letter-spacing:.12em}.body{font-size:14px}.piece{font:35px Georgia,serif;text-anchor:middle;dominant-baseline:middle}.pw{fill:#f8f3e7;stroke:#292b25;stroke-width:1;paint-order:stroke}.pb{fill:#24231d;stroke:#efe6d1;stroke-width:.55;paint-order:stroke}.rule{stroke:#3a3930}.coord{font:700 7px 'Segoe UI',sans-serif;fill:#34372b}
    </style>
  </defs>
  <rect width="390" height="844" fill="#171713"/>
  <rect width="390" height="4" fill="#d8ad55"/>

  <g class="ui">
    <text class="display ink" x="12" y="38" font-size="23" font-weight="700">Chess</text>
    <text class="muted label" x="79" y="34">TWO PLAYERS</text>
    <g transform="translate(330 12)" stroke="#f4f0e6" fill="none" stroke-width="1.8" stroke-linecap="round">
      <rect width="48" height="40" rx="4" stroke="#4b493e"/><path d="M15 16v-5h5M33 16v-5h-5M15 24v5h5M33 24v5h-5"/>
    </g>
    <line class="rule" x1="12" y1="62" x2="378" y2="62"/>

    <g transform="translate(12 74)">
      <circle cx="9" cy="15" r="8" fill="#24231d" stroke="#efe6d1"/>
      <text class="ink body" x="26" y="20">Black</text>
      <text class="muted body" x="366" y="20" text-anchor="end">waiting</text>
    </g>
  </g>

  <g transform="translate(12 108)">
    <rect width="366" height="366" fill="url(#board)"/>
    <rect x="183" y="274.5" width="45.75" height="45.75" fill="#e5c15e" opacity=".65"/>
    <circle cx="205.875" cy="251.625" r="6" fill="#283128" opacity=".6"/>
    <circle cx="205.875" cy="205.875" r="6" fill="#283128" opacity=".6"/>
    <rect x="1" y="1" width="364" height="364" fill="none" stroke="#0f100d" stroke-width="2"/>
    <g class="coord"><text x="3" y="9">8</text><text x="3" y="55">7</text><text x="3" y="100">6</text><text x="3" y="146">5</text><text x="3" y="192">4</text><text x="3" y="238">3</text><text x="3" y="284">2</text><text x="3" y="329">1</text><text x="40" y="361">a</text><text x="86" y="361">b</text><text x="132" y="361">c</text><text x="178" y="361">d</text><text x="224" y="361">e</text><text x="270" y="361">f</text><text x="316" y="361">g</text><text x="361" y="361">h</text></g>
    <g class="piece pb"><text x="22.875" y="23">♜</text><text x="68.625" y="23">♞</text><text x="114.375" y="23">♝</text><text x="160.125" y="23">♛</text><text x="205.875" y="23">♚</text><text x="251.625" y="23">♝</text><text x="297.375" y="23">♞</text><text x="343.125" y="23">♜</text><text x="22.875" y="69">♟</text><text x="68.625" y="69">♟</text><text x="114.375" y="69">♟</text><text x="160.125" y="69">♟</text><text x="205.875" y="69">♟</text><text x="251.625" y="69">♟</text><text x="297.375" y="69">♟</text><text x="343.125" y="69">♟</text></g>
    <g class="piece pw"><text x="22.875" y="297">♟</text><text x="68.625" y="297">♟</text><text x="114.375" y="297">♟</text><text x="160.125" y="297">♟</text><text x="205.875" y="297">♟</text><text x="251.625" y="297">♟</text><text x="297.375" y="297">♟</text><text x="343.125" y="297">♟</text><text x="22.875" y="343">♜</text><text x="68.625" y="343">♞</text><text x="114.375" y="343">♝</text><text x="160.125" y="343">♛</text><text x="205.875" y="343">♚</text><text x="251.625" y="343">♝</text><text x="297.375" y="343">♞</text><text x="343.125" y="343">♜</text></g>
  </g>

  <g class="ui" transform="translate(12 486)">
    <circle cx="9" cy="16" r="8" fill="#f8f3e7" stroke="#36372f"/>
    <text class="display ink" x="27" y="23" font-size="22" font-weight="650">White to move</text>
    <text class="muted" x="366" y="20" font-size="12" text-anchor="end">Select a piece</text>
    <line class="rule" x1="0" y1="38" x2="366" y2="38"/>

    <g transform="translate(0 54)">
      <rect width="112" height="48" rx="4" fill="#2b2a23" stroke="#4b493e"/><text class="ink body" x="56" y="30" text-anchor="middle">Undo</text>
      <rect x="122" width="112" height="48" rx="4" fill="#2b2a23" stroke="#4b493e"/><text class="ink body" x="178" y="30" text-anchor="middle">Restart</text>
      <rect x="244" width="122" height="48" rx="4" fill="none" stroke="#4b493e"/><text class="muted body" x="305" y="30" text-anchor="middle">Menu</text>
    </g>

    <g transform="translate(0 124)">
      <rect width="366" height="174" rx="6" fill="#24231d" stroke="#3a3930"/>
      <text class="muted label" x="16" y="29">MOVE LEDGER</text>
      <path d="M336 20l7 7 7-7" stroke="#b9b3a4" fill="none" stroke-width="2"/>
      <line class="rule" x1="16" y1="43" x2="350" y2="43"/>
      <text class="muted body" x="16" y="75">No moves yet.</text>
      <text class="muted" x="16" y="107" font-size="12">Moves appear here in standard notation.</text>
      <line class="rule" x1="16" y1="126" x2="350" y2="126"/>
      <text class="muted label" x="16" y="153">POSITION</text>
      <text fill="#d7d1c4" x="98" y="153" font-family="Consolas,monospace" font-size="11">rnbqkbnr/pppppppp/8/8/…</text>
    </g>
  </g>
  <rect x="145" y="831" width="100" height="4" rx="2" fill="#615f54"/>
</svg>
